# SSV 50 m smallbore rifle target (the ISSF 50 m face: 154.4 mm scoring field, 112.4 mm black), 5-point scoring: 10 and 9 count 5, 8 and 7 count 4, and so on.
# SIUS STYX (SUI-50m-Targets-Package) scores it from the hit's centre on a 160 mm field: this face plus half a 5.6 mm calibre.
id = "ch-50m-kka5"
name = "SSV Kleinkaliberscheibe A5 50 m"
short_name = "KK A5"
group = "Schweiz"
distances_m = [50]
# Outer diameter of each scoring ring from the centre outwards, in mm.
ring_diameters_mm = [26.4, 58.4, 90.4, 122.4, 154.4]
black_mm = 112.4

[scoring]
# The only scores a shot can have, best first; 0 is a miss.
values = [5, 4, 3, 2, 1, 0]

[source]
title = "SSV Regeln für das sportliche Schiessen, Teil B: Technische Regeln Gewehr (TRG)"
rule = "Art. 26"
url = "https://www.swissshooting.ch/media/sslercxt/dok-1104022-d.pdf"
