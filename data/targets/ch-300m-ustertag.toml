# Special target of the Ustertag-Schiessen (SG Uster), rifle 300 m. Rectangles, not rings: 5 = 150 x 200 mm,
# 4 = 300 x 500 mm, 3 = 440 x 770 mm plus a 30 mm trapezium, 2 = the head, 200 x 185 mm.
id = "ch-300m-ustertag"
name = "Ustertag-Scheibe 300 m"
short_name = "Uster 300 m"
group = "Schweiz"
distances_m = [300]

[scoring]
# The only scores a shot can have, best first; 0 is a miss.
values = [5, 4, 3, 2, 0]

[source]
title = "SG Uster, Ustertag-Schiessen: Ablauf (Scheiben)"
url = "https://www.ustertagschiessen.ch/Home/Ablauf"

# The icon, from the club's dimensioned drawing (ustertagschiessen.ch/img/various/riftargetdim.gif):
# white card, black body with the 30 mm trapezium on top, the head above it, the 4 as a white frame and the
# 5 in white and red. Card size and the gap under the head are read off the drawing.
[[shapes]]
rect = [-450, -640, 900, 1100]
fill = "white"

[[shapes]]
rect = [-100, -630, 200, 185]
fill = "black"

[[shapes]]
polygon = [[-220, 385], [220, 385], [220, -385], [180, -415], [-180, -415], [-220, -385]]
fill = "black"

[[shapes]]
rect = [-150, -250, 300, 500]
line = "white"

[[shapes]]
rect = [-75, -100, 150, 200]
fill = "white"

[[shapes]]
rect = [0, -100, 75, 200]
fill = "red"
