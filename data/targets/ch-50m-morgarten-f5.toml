# Morgartenscheibe F5 (also F100/5): 45 × 100 cm, khaki green, ordnance pistols only, shot at the Morgarten,
# Rothenthurm and Schwaderloh shoots. The 5 is an oval of 10 × 15 cm; the other zones are not round rings.
id = "ch-50m-morgarten-f5"
name = "Morgartenscheibe F5 50 m"
short_name = "F5"
group = "Schweiz"
distances_m = [50]

[scoring]
# The only scores a shot can have, best first; 0 is a miss.
values = [5, 4, 3, 2, 1, 0]

[source]
title = "Pistolenklub Aeschi, Scheiben (Morgarten-, Rothenthurm-, Schwaderloh-Schiessen F100/5)"
url = "https://pk-aeschi.ch/schiesswesen/scheiben"

# The icon, from SIUS's Morgarten target (SiusData Target.ini), in mm from the centre: green figure 460 wide
# from 380 above to 410 below the centre, sloped shoulders and a head 210 wide up to 600 above, on a khaki
# card (45 x 100 cm per the club; SIUS's figure is about 1 cm larger, so the card is drawn around it). The
# zones are ovals: 5 = 100 x 150 (published; SIUS 100 x 160), 4 = 260 x 380, 3 = 420 x 600, 2 = 580 x 800,
# wider than the figure, so only its top and bottom show; the 1 is the rest of the figure.
[[shapes]]
rect = [-240, -610, 480, 1030]
fill = "khaki"

[[shapes]]
polygon = [[-105, -600], [105, -600], [105, -400], [230, -380], [230, 410], [-230, 410], [-230, -380], [-105, -400]]
fill = "green"

[[shapes]]
ellipse = [0, 0, 100, 150]
line = "white"

[[shapes]]
ellipse = [0, 0, 260, 380]
line = "white"

[[shapes]]
ellipse = [0, 0, 420, 600]
line = "white"

[[shapes]]
ellipse = [0, 0, 580, 800]
line = "white"
