# Special target of the Ustertag-Schiessen (SG Uster), pistol 50 m, with the Uster coat of arms; scores 10 to 5 or 0.
id = "ch-50m-ustertag"
name = "Ustertag-Scheibe 50 m"
short_name = "Uster 50 m"
group = "Schweiz"
distances_m = [50]

[scoring]
# The only scores a shot can have, best first; 0 is a miss.
values = [10, 9, 8, 7, 6, 5, 0]

[source]
title = "SG Uster, Ustertag-Schiessen: Ablauf (Scheiben)"
url = "https://www.ustertagschiessen.ch/Home/Ablauf"

# The icon, from the club's picture (ustertagschiessen.ch/img/various/50mTarget2018.jpg): nested black
# rectangles 5 to 8 with white lines, a white 9 and the 10 with the red of the Uster arms. No sizes are
# published: the proportions are measured off the picture and scaled to a 50 x 90 cm 5 zone.
[[shapes]]
rect = [-260, -460, 520, 920]
fill = "white"

[[shapes]]
rect = [-250, -450, 500, 900]
fill = "black"

[[shapes]]
rect = [-210, -365, 420, 730]
line = "white"

[[shapes]]
rect = [-167, -279, 334, 558]
line = "white"

[[shapes]]
rect = [-129, -195, 258, 390]
line = "white"

[[shapes]]
rect = [-84, -109, 168, 218]
fill = "white"

[[shapes]]
rect = [0, -67, 45, 134]
fill = "red"

[[shapes]]
rect = [-45, -67, 90, 134]
line = "black"
