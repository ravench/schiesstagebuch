# 300m (Kanada), SIUS's target 573 in SiusData's Target.ini (CSF/TG300m.TRG).
# Fullbore (ICFRA) target: 5, 4 and 3 are rings (Ø 140, Ø 280, Ø 420 mm), the 2 is
# the rest of the square card. The dashed V-bull inside the 5 only breaks ties.
id = "ca-fullbore-300-m"
name = "Fullbore 300 m (CA)"
short_name = "Fullbore 300 m"
group = "Kanada"
distances_m = [300]

[scoring]
