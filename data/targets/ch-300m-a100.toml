# Swiss 300 m Scheibe A, scored in hundredths: the same 100 cm field as A10, one point per
# 0.5 cm from the centre, so 91 to 100 hundredths make an A10 ten. Same face as
# ch-300m-a10, so no rings here.
id = "ch-300m-a100"
name = "Scheibe A100 300 m"
short_name = "A100"
distances_m = [300]

[scoring]
# Any value from 0 up to max in steps of step.
max = 100
step = 1

