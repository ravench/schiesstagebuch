name: Build
on:
  # Branches are built through their pull request; building their pushes too
  # would take a second Mac runner for every commit.
  push:
    branches: [main]
  pull_request:
defaults:
  run:
    # pipefail: otherwise a failing xcodebuild piped into xcpretty still passes.
    shell: bash -eo pipefail {0}
jobs:
  lint:
    runs-on: ubuntu-latest
    # Official SwiftLint image with a pinned version, so results don't change under us.
    container: ghcr.io/realm/swiftlint:0.59.1
    steps:
      - uses: actions/checkout@v5
      - name: SwiftLint
        # --strict turns every warning into a failure; the reporter adds annotations to the PR.
        run: swiftlint lint --strict --reporter github-actions-logging
  build:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Check translations
        run: python3 tools/localize.py && git diff --exit-code Schiesstagebuch/Resources/Localizable.xcstrings
      - name: Tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
      - name: Build for simulator
        run: |
          xcodebuild build \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Check orientations in the built app
        # The same rule App Store Connect applies on upload (iPad multitasking).
        run: |
          PLIST=$(find ~/Library/Developer/Xcode/DerivedData -path '*/Debug-iphonesimulator/Schiesstagebuch.app/Info.plist' | head -1)
          python3 tools/check_orientations.py "$PLIST"
      - name: Unit tests
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 -c "
          import json, sys
          devices = json.load(sys.stdin)['devices']
          ios = sorted((k for k in devices if 'iOS' in k), reverse=True)
          print(next(d['udid'] for k in ios for d in devices[k] if d['name'].startswith('iPhone')))")
          echo "Testing on $UDID"
          xcodebuild test \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -destination "id=$UDID" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
