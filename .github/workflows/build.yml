name: Build
on:
  # Branches are built through their pull request; building their pushes too
  # would take a second Mac runner for every commit.
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request cancels this run. On main a running build
# finishes; a newer merge only replaces a run that is still waiting for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    # pipefail: otherwise a failing xcodebuild piped into xcpretty still passes.
    shell: bash -eo pipefail {0}
jobs:
  lint:
    runs-on: ubuntu-latest
    # Official SwiftLint image with a pinned version, so results don't change under us.
    container: ghcr.io/realm/swiftlint:0.59.1
    steps:
      - uses: actions/checkout@v5
      - name: SwiftLint
        # --strict turns every warning into a failure; the reporter adds annotations to the PR.
        run: swiftlint lint --strict --reporter github-actions-logging
  changes:
    # Pull requests that change only docs, tools or other workflows skip the Mac job (see
    # tools/ci_changes.py); lint and the tools job still check them. Pushes to main always build.
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mac: ${{ steps.check.outputs.mac }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then echo mac=true >> "$GITHUB_OUTPUT"; exit 0; fi
          gh api "repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}/files" --paginate \
            --jq '.[] | .filename, (.previous_filename // empty)' | python3 tools/ci_changes.py | tee -a "$GITHUB_OUTPUT"
  tools:
    # The Python checks need no Mac.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # tools/generate_assets.py reads the calibre data from the calibre-data submodule.
          submodules: true
      - name: Check translations
        run: python3 tools/localize.py && git diff --exit-code Schiesstagebuch/Resources/Localizable.xcstrings
      - name: Tool tests
        run: python3 -m unittest discover -s tools -p 'test_*.py'
  build:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Pick an iPhone simulator and a build folder
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tools/pr_screens.py pick-iphone)
          echo "Testing on $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
      # Compiled once in the two build steps; the unit and UI tests below run on that build
      # (test-without-building). The unit test scheme goes last: building the app for
      # SchiesstagebuchScreens drops the unit test bundle from the app's PlugIns, and the unit
      # tests then fail to load it.
      - name: Build UI tests
        run: |
          xcodebuild build-for-testing \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Build app and unit tests
        run: |
          xcodebuild build-for-testing \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Check orientations in the built app
        # The same rule App Store Connect applies on upload (iPad multitasking).
        run: python3 tools/check_orientations.py "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Schiesstagebuch.app/Info.plist"
      - name: Unit tests
        id: unit-tests
        run: |
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: UI tests
        # Flows that unit tests can't reach, such as presenting sheets from the entry editor.
        # Also after failed unit tests, so one run shows both.
        if: success() || steps.unit-tests.conclusion == 'failure'
        run: |
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:SchiesstagebuchUITests/WeatherRelayUITests \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Test summary
        # Passed, failed and skipped counts and the failed tests by name, on the run's summary page.
        if: always()
        run: |
          for NAME in UnitTests UITests; do
            [ -d "$RUNNER_TEMP/$NAME.xcresult" ] || continue
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$NAME.xcresult" \
              > "$RUNNER_TEMP/$NAME.json" || true
          done
          python3 tools/test_summary.py "Unit tests=$RUNNER_TEMP/UnitTests.json" "UI tests=$RUNNER_TEMP/UITests.json"
