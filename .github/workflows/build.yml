name: Build
on:
  # Branches are built through their pull request; building their pushes too
  # would take a second Mac runner for every commit.
  push:
    branches: [main]
  pull_request:
# A newer push to the same pull request cancels this run. On main a running build
# finishes; a newer merge only replaces a run that is still waiting for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    # pipefail: otherwise a failing xcodebuild piped into xcpretty still passes.
    shell: bash -eo pipefail {0}
jobs:
  lint:
    runs-on: ubuntu-latest
    # Reads the code, nothing else.
    permissions:
      contents: read
    # Official SwiftLint image with a pinned version, so results don't change under us.
    container: ghcr.io/realm/swiftlint:0.59.1
    steps:
      - uses: actions/checkout@v5
      - name: SwiftLint
        # --strict turns every warning into a failure; the reporter adds annotations to the PR.
        run: swiftlint lint --strict --reporter github-actions-logging
  changes:
    # Pull requests that change only docs, tools or other workflows skip the Mac job (see
    # tools/ci_changes.py); lint and the tools job still check them. Pushes to main always build.
    # Pull requests that change how a screen looks, or carry the «screens» label, also get the PR screens in the Mac job, and the iPad
    # screens in their own (ipad-screens).
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pull-requests: read
    outputs:
      mac: ${{ steps.check.outputs.mac }}
      screens: ${{ steps.check.outputs.screens }}
    steps:
      - uses: actions/checkout@v5
      - id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          if [ "${{ github.event_name }}" != pull_request ]; then printf 'mac=true\nscreens=false\n' >> "$GITHUB_OUTPUT"; exit 0; fi
          PR="repos/${{ github.repository }}/pulls/${{ github.event.pull_request.number }}"
          # Read now, not from the event: a re-run after adding the «screens» label takes the screens.
          LABELS=$(gh api "$PR" --jq '.labels[].name')
          gh api "$PR/files" --paginate --jq '.[] | .filename, (.previous_filename // empty)' \
            | python3 tools/ci_changes.py "$LABELS" | tee -a "$GITHUB_OUTPUT"
  tools:
    # The Python checks need no Mac.
    runs-on: ubuntu-latest
    # Reads the code, nothing else.
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          # tools/generate_assets.py reads the calibre data from the calibre-data submodule.
          submodules: true
      - name: Submodule not behind main
        # A merge can keep a branch's older calibre-data pointer and so revert a bump once merged
        # (Kaliberfinder PR 188, 2026-11-12): the regenerated catalogue matches that pointer, so
        # the check below cannot see it. The pointer must be main's or newer.
        if: github.event_name == 'pull_request'
        run: |
          git fetch -q --depth=1 origin main
          main=$(git ls-tree FETCH_HEAD calibre-data | awk '{print $3}')
          git -C calibre-data fetch -q --unshallow origin 2>/dev/null || git -C calibre-data fetch -q origin
          [ -n "$main" ] || { echo "::error::main has no calibre-data pointer"; exit 1; }
          # main's pointer can predate the public repository's history (it started over on 2026-11-22).
          if ! git -C calibre-data cat-file -e "$main^{commit}" 2>/dev/null; then
            echo "::notice::main's calibre-data ${main:0:7} is not in the public history: not compared"; exit 0
          fi
          git -C calibre-data merge-base --is-ancestor "$main" HEAD \
            || { echo "::error::calibre-data is at $(git -C calibre-data rev-parse --short HEAD), behind main's ${main:0:7}: run tools/bump_data.py $main"; exit 1; }
      - name: Check generated data and translations
        run: |
          python3 tools/generate_assets.py
          python3 tools/targets.py json Schiesstagebuch/Resources/Targets.json
          python3 tools/position_icons.py
          python3 tools/localize.py
          # Also new files, e.g. the image set of a new shooting position nobody committed.
          git add -N Schiesstagebuch/Resources && git diff --exit-code Schiesstagebuch/Resources
      - name: Tool tests
        # Pillow, so the PR screens comparison (tools/pr_screens.py) is tested, not skipped.
        run: pip3 install --quiet pillow && python3 -m unittest discover -s tools -p 'test_*.py'
  build:
    needs: changes
    if: needs.changes.outputs.mac == 'true'
    # GitHub's Mac, or the self-hosted one named in the MAC_RUNNER variable while the repo is
    # private (README, CI on your own Mac).
    runs-on: ${{ github.event.repository.private && vars.MAC_RUNNER || 'macos-26' }}
    permissions:
      contents: read
    env:
      # Pull requests that change how a screen looks, or carry the «screens» label (tools/ci_changes.py),
      # also get the PR screens.
      SCREENS_TOUR: ${{ needs.changes.outputs.screens }}
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Images (app icon) are in Git LFS.
          lfs: true
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: xcodegen generate
      - name: Pick an iPhone simulator and a build folder
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tools/pr_screens.py pick-iphone)
          echo "Testing on $UDID"
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          # Outside the checkout; upload-artifact rejects '..' paths.
          echo "SCREENS=$RUNNER_TEMP/screens" >> "$GITHUB_ENV"
          # Erased first, so a Mac that keeps its simulators starts as clean as GitHub's. A fresh
          # simulator takes minutes to boot; it boots while the app compiles.
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
      # Compiled once in the two build steps; the unit and UI tests below run on that build
      # (test-without-building). The unit test scheme goes last: building the app for
      # SchiesstagebuchScreens drops the unit test bundle from the app's PlugIns, and the unit
      # tests then fail to load it.
      - name: Build UI tests
        id: build-ui
        run: |
          xcodebuild build-for-testing \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Build app and unit tests
        run: |
          xcodebuild build-for-testing \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Check orientations in the built app
        # The same rule App Store Connect applies on upload (iPad multitasking).
        run: python3 tools/check_orientations.py "$DERIVED_DATA/Build/Products/Debug-iphonesimulator/Schiesstagebuch.app/Info.plist"
      - name: Unit tests
        id: unit-tests
        run: |
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -resultBundlePath "$RUNNER_TEMP/UnitTests.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: UI tests
        # Flows that unit tests can't reach, such as presenting sheets from the entry editor.
        # Also after failed unit tests, so one run shows both.
        if: success() || steps.unit-tests.conclusion == 'failure'
        run: |
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:SchiesstagebuchUITests/WeatherFieldsUITests \
            -only-testing:SchiesstagebuchUITests/AppleWeatherUITests \
            -only-testing:SchiesstagebuchUITests/EditorPickerUITests \
            -only-testing:SchiesstagebuchUITests/LastStichDeletionUITests \
            -resultBundlePath "$RUNNER_TEMP/UITests.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Test summary
        # Passed, failed and skipped counts and the failed tests by name, on the run's summary page.
        if: always()
        run: |
          for NAME in UnitTests UITests; do
            [ -d "$RUNNER_TEMP/$NAME.xcresult" ] || continue
            xcrun xcresulttool get test-results summary --path "$RUNNER_TEMP/$NAME.xcresult" \
              > "$RUNNER_TEMP/$NAME.json" || true
          done
          python3 tools/test_summary.py "Unit tests=$RUNNER_TEMP/UnitTests.json" "UI tests=$RUNNER_TEMP/UITests.json"
      # PR screens: the screen tour (SchiesstagebuchUITests/PRScreensTests.swift) on this pull request
      # here, and on its base branch in the base-screens job at the same time, on a second Mac; the
      # screens job compares them. The tour reuses this build and simulator. The iPad screens: job
      # ipad-screens below.
      - name: Screens of this pull request
        id: screens
        if: "!cancelled() && env.SCREENS_TOUR == 'true' && steps.build-ui.outcome == 'success'"
        run: |
          mkdir -p "$SCREENS"
          xcrun simctl bootstatus "$UDID" >/dev/null
          # Same clock and bars in both tours, so unchanged screens give the same image.
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          # Without what the tests above left in the app's container.
          xcrun simctl uninstall "$UDID" ch.giotta.schiesstagebuch
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:SchiesstagebuchUITests/PRScreensTests \
            -resultBundlePath "$SCREENS/after.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Export the screens
        # A tour that broke off still gives the screens it took.
        if: "!cancelled() && steps.screens.outcome != 'skipped'"
        run: |
          xcrun xcresulttool export attachments --path "$SCREENS/after.xcresult" --output-path "$SCREENS/raw"
          python3 tools/pr_screens.py rename "$SCREENS/raw" "$SCREENS/after"
      - uses: actions/upload-artifact@v5
        if: "!cancelled() && steps.screens.outcome != 'skipped'"
        with:
          name: pr-screens-after
          overwrite: true # a re-run of the job uploads again
          path: ${{ env.SCREENS }}/after
      - name: Shut down the simulator
        # A self-hosted Mac would otherwise keep it running until the next run.
        if: always()
        run: xcrun simctl shutdown "$UDID" 2>/dev/null || true
  base-screens:
    # The PR screens' «before»: the base branch toured with this pull request's tour, on its own Mac
    # while the build job compiles, tests and tours the pull request. A later push to the pull
    # request takes them from the cache while the base, the tour, Xcode, the runner image and the
    # day are the same: the tour then only runs here once per base.
    needs: changes
    if: needs.changes.outputs.screens == 'true'
    # GitHub's Mac, or the self-hosted one named in the MAC_RUNNER variable while the repo is
    # private (README, CI on your own Mac).
    runs-on: ${{ github.event.repository.private && vars.MAC_RUNNER || 'macos-26' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Images (app icon) are in Git LFS.
          lfs: true
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - name: Cache key
        id: key
        run: |
          echo "SCREENS=$RUNNER_TEMP/screens" >> "$GITHUB_ENV"
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          tour=$(cat SchiesstagebuchUITests/PRScreensTests.swift tools/pr_screens.py tools/ipad_screens.py | shasum -a 256 | cut -c1-16)
          xcode=$(xcodebuild -version | tr -cs 'A-Za-z0-9.' '-')
          # The day too: the sample data's dates count from today.
          echo "key=pr-screens-before-$(git rev-parse HEAD^1)-$tour-$xcode${ImageVersion:-self-hosted}-$(date -u +%F)" >> "$GITHUB_OUTPUT"
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: ${{ env.SCREENS }}/before
          key: ${{ steps.key.outputs.key }}
      - name: Check out the base branch with this pull request's tour
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          mkdir -p "$SCREENS"
          cp SchiesstagebuchUITests/PRScreensTests.swift tools/pr_screens.py tools/ipad_screens.py "$SCREENS/"
          git checkout -q HEAD^1
          git submodule update -q
          cp "$SCREENS/PRScreensTests.swift" SchiesstagebuchUITests/
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
      - name: Pick an iPhone simulator
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # The same pick as the build job's, so both sides come from the same iPhone.
          UDID=$(xcrun simctl list devices available -j | python3 "$SCREENS/pr_screens.py" pick-iphone)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          xcrun simctl shutdown "$UDID" 2>/dev/null || true
          xcrun simctl erase "$UDID"
          xcrun simctl boot "$UDID"
      - name: Screens of the base branch
        id: tour
        # A base without some of the screens still gives the others.
        if: steps.cache.outputs.cache-hit != 'true'
        continue-on-error: true
        run: |
          xcodebuild build-for-testing \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
          xcrun simctl bootstatus "$UDID" >/dev/null
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:SchiesstagebuchUITests/PRScreensTests \
            -resultBundlePath "$SCREENS/before.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Export the screens
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          # A run that broke off early leaves no readable result: that side just has no screens.
          mkdir -p "$SCREENS/before"
          xcrun xcresulttool export attachments --path "$SCREENS/before.xcresult" --output-path "$SCREENS/raw" \
            && python3 "$SCREENS/pr_screens.py" rename "$SCREENS/raw" "$SCREENS/before" || true
      - uses: actions/cache/save@v5
        # Only a full tour: a broken one is toured again next time.
        if: steps.tour.outcome == 'success'
        with:
          path: ${{ env.SCREENS }}/before
          key: ${{ steps.key.outputs.key }}
      - uses: actions/upload-artifact@v5
        with:
          name: pr-screens-before
          overwrite: true
          path: ${{ env.SCREENS }}/before
          if-no-files-found: ignore
      - name: Shut down the simulator
        if: always()
        run: '[ -z "$UDID" ] || xcrun simctl shutdown "$UDID" 2>/dev/null || true'
  screens:
    # Compares both tours and comments with the screens that look different. The images are kept
    # in ch-giotta/app-screens on its schiesstagebuch/pr-screens branch, outside this repo's history;
    # all screens of a run are in its pr-screens-after and pr-screens-before artifacts.
    needs: [changes, build, base-screens]
    if: "!cancelled() && needs.changes.outputs.screens == 'true'"
    runs-on: ubuntu-latest
    permissions:
      contents: read # the images go to ch-giotta/app-screens with a deploy key
      pull-requests: write # and the comment on the pull request
    env:
      SCREENS: ${{ github.workspace }}/screens
    steps:
      - uses: actions/checkout@v5
      - uses: actions/download-artifact@v6
        id: after
        continue-on-error: true
        with:
          name: pr-screens-after
          path: ${{ env.SCREENS }}/after
      - uses: actions/download-artifact@v6
        # A base tour that took no screens leaves no artifact: every screen is then new.
        continue-on-error: true
        with:
          name: pr-screens-before
          path: ${{ env.SCREENS }}/before
      - name: Compare
        id: compare
        if: steps.after.outcome == 'success'
        run: |
          cd "$SCREENS"
          mkdir -p before
          # Pillow lets the comparison ignore faint rendering noise.
          python3 -m venv venv && venv/bin/pip install -q pillow
          venv/bin/python ../tools/pr_screens.py changes before after changed
          # Smaller copies for the comment; the artifacts keep the full size.
          venv/bin/python ../tools/pr_screens.py shrink changed 1200
      - name: Comment on the pull request
        # Pull requests from forks get a read-only token, so they only get the artifacts.
        if: "!cancelled() && steps.compare.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCREENS_REPO: ch-giotta/app-screens
          SCREENS_BRANCH: ${{ github.event.repository.name }}/pr-screens
          SCREENS_DEPLOY_KEY: ${{ secrets.SCREENS_DEPLOY_KEY }}
        run: cd "$SCREENS" && bash ../tools/publish_pr_screens.sh changed
  ipad-screens:
    # The iPad screens (SchiesstagebuchUITests/IPadScreensTests.swift, every tab in portrait and
    # landscape) of pull requests that change the GUI, on the pull request and on its base branch,
    # and their own comment with the ones that look different, like the PR screens above.
    # Its own Mac runner, next to build: an iPad booted beside the iPhone overloaded the runner,
    # and one after the other made build 14 minutes longer. The base branch's screens are cached
    # like the base-screens job's, so a later push to the pull request tours only the pull request.
    needs: changes
    if: needs.changes.outputs.screens == 'true'
    # GitHub's Mac, or the self-hosted one named in the MAC_RUNNER variable while the repo is
    # private (README, CI on your own Mac).
    runs-on: ${{ github.event.repository.private && vars.MAC_RUNNER || 'macos-26' }}
    permissions:
      contents: read # the screens go to ch-giotta/app-screens with a deploy key
      pull-requests: write # and the comment to the pull request
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # Images (app icon) are in Git LFS.
          lfs: true
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - run: command -v xcodegen >/dev/null || brew install xcodegen
      - run: xcodegen generate
      - name: Pick an iPad and a build folder
        run: |
          IPAD=$(xcrun simctl list devices available -j | python3 tools/ipad_screens.py pick-ipad)
          echo "iPad screens on $IPAD"
          echo "IPAD=$IPAD" >> "$GITHUB_ENV"
          echo "DERIVED_DATA=$RUNNER_TEMP/DerivedData" >> "$GITHUB_ENV"
          echo "SCREENS=$RUNNER_TEMP/screens" >> "$GITHUB_ENV"
          tour=$(cat SchiesstagebuchUITests/IPadScreensTests.swift tools/pr_screens.py tools/ipad_screens.py | shasum -a 256 | cut -c1-16)
          xcode=$(xcodebuild -version | tr -cs 'A-Za-z0-9.' '-')
          # The day too: the sample data's dates count from today.
          echo "BASE_KEY=ipad-screens-before-$(git rev-parse HEAD^1)-$tour-$xcode${ImageVersion:-self-hosted}-$(date -u +%F)" >> "$GITHUB_ENV"
          # Erased first, so a Mac that keeps its simulators starts as clean as GitHub's. A fresh
          # simulator takes minutes to boot; it boots while the app compiles, so the first tour
          # does not meet a simulator that is still settling.
          xcrun simctl shutdown "$IPAD" 2>/dev/null || true
          xcrun simctl erase "$IPAD"
          xcrun simctl boot "$IPAD"
      - name: Build
        run: |
          xcodebuild build-for-testing \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$IPAD" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Screens of this pull request
        id: screens
        run: |
          mkdir -p "$SCREENS"
          # The base branch is toured with this pull request's tour and tools.
          cp SchiesstagebuchUITests/IPadScreensTests.swift tools/pr_screens.py tools/ipad_screens.py \
            tools/publish_pr_screens.sh "$SCREENS/"
          xcrun simctl bootstatus "$IPAD" >/dev/null
          # Same clock and bars in both tours, so unchanged screens give the same image.
          xcrun simctl status_bar "$IPAD" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --batteryState charged --batteryLevel 100
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$IPAD" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:SchiesstagebuchUITests/IPadScreensTests \
            -resultBundlePath "$SCREENS/after.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - uses: actions/cache/restore@v5
        id: cache
        with:
          path: ${{ env.SCREENS }}/before
          key: ${{ env.BASE_KEY }}
      - name: Screens of the base branch
        id: base
        # A base without some of the screens still gives the others.
        if: "!cancelled() && steps.screens.outcome != 'skipped' && steps.cache.outputs.cache-hit != 'true'"
        continue-on-error: true
        run: |
          git checkout -q HEAD^1
          git submodule update -q
          cp "$SCREENS/IPadScreensTests.swift" SchiesstagebuchUITests/
          xcodegen generate
          # Same build folder: only what the pull request changed compiles again.
          xcodebuild build-for-testing \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$IPAD" \
            -derivedDataPath "$DERIVED_DATA" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
          xcrun simctl uninstall "$IPAD" ch.giotta.schiesstagebuch
          xcodebuild test-without-building \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$IPAD" \
            -derivedDataPath "$DERIVED_DATA" \
            -only-testing:SchiesstagebuchUITests/IPadScreensTests \
            -resultBundlePath "$SCREENS/before.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Compare
        id: compare
        if: "!cancelled() && steps.screens.outcome != 'skipped'"
        run: |
          cd "$SCREENS"
          python3 -m venv venv && venv/bin/pip install -q pillow
          for side in after before; do
            mkdir -p "$side"
            [ -d "$side.xcresult" ] || continue
            xcrun xcresulttool export attachments --path "$side.xcresult" --output-path "raw-$side" || continue
            python3 pr_screens.py rename "raw-$side" "$side"
            # Screenshots come in the device's portrait buffer; turn landscape ones upright. Cached
            # base screens were turned when they were taken.
            for f in "$side"/landscape-*.png; do [ -e "$f" ] && sips -r 270 "$f" >/dev/null; done
          done
          venv/bin/python pr_screens.py changes before after changed ipad
          find changed -name '*.png' -exec sips -Z 1200 {} \; >/dev/null
      - uses: actions/cache/save@v5
        # Only a full tour: a broken one is toured again next time.
        if: "!cancelled() && steps.base.outcome == 'success' && steps.compare.outcome == 'success'"
        with:
          path: ${{ env.SCREENS }}/before
          key: ${{ env.BASE_KEY }}
      - uses: actions/upload-artifact@v5
        if: "!cancelled() && steps.screens.outcome != 'skipped'"
        with:
          name: ipad-screens
          overwrite: true
          path: |
            ${{ env.SCREENS }}/after
            ${{ env.SCREENS }}/before
      - name: Comment on the pull request
        if: "!cancelled() && steps.compare.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository"
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          HEAD_SHA: ${{ github.event.pull_request.head.sha }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
          SCREENS_REPO: ch-giotta/app-screens
          SCREENS_BRANCH: ${{ github.event.repository.name }}/pr-screens
          SCREENS_DEPLOY_KEY: ${{ secrets.SCREENS_DEPLOY_KEY }}
        run: cd "$SCREENS" && bash publish_pr_screens.sh changed ipad
      - name: Shut down the simulator
        # A self-hosted Mac would otherwise keep it running until the next run.
        if: always()
        run: xcrun simctl shutdown "$IPAD" 2>/dev/null || true
