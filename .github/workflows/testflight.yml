name: TestFlight
# Uploads a build to TestFlight after the Build workflow passes on main.
# Needs the repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App Store
# Connect API key with the Admin role); without them the upload is skipped.
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    # pipefail: otherwise a failing xcodebuild piped into xcpretty still passes.
    shell: bash -eo pipefail {0}
jobs:
  wait:
    # Only builds whose tests passed, and only pushes to main (not PRs from a branch named main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Several merges within a minute make one upload: a newer run cancels the older run's wait,
    # and the upload job only runs after its own run's wait finished.
    concurrency:
      group: testflight-wait
      cancel-in-progress: true
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Wait for more merges
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Check this is still the newest commit on main
        # A newer commit's Build may finish first (Mac runners queue); its own run uploads then.
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_run ]; then
            MAIN=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            if [ "$MAIN" != "$SHA" ]; then
              echo "::notice::Upload skipped: main has moved on to $MAIN, whose run uploads instead."
              exit 0
            fi
          fi
          echo "latest=true" >> "$GITHUB_OUTPUT"
  upload:
    needs: wait
    if: needs.wait.outputs.latest == 'true'
    # One upload at a time; never cancel one that has started.
    concurrency:
      group: testflight
      cancel-in-progress: false
    runs-on: macos-26
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped: set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets."
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          # The commit the Build workflow tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
      - name: Prepare
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python3 -m unittest discover -s tools -p 'test_testflight.py'
          brew install xcodegen
          xcodegen generate
          # The runner is thrown away after the job, key included.
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 tools/testflight.py export-options "$RUNNER_TEMP/ExportOptions.plist"
          python3 tools/testflight.py export-options "$RUNNER_TEMP/ExportLocal.plist" export
          BUILD=$(python3 tools/testflight.py build-number "${{ github.run_number }}")
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "Build number $BUILD"
      - name: Archive
        # Unsigned: automatic signing here made every fresh runner create a new Apple Development
        # certificate until the team hit Apple's limit (2026-11-03), and ad hoc signing is not
        # allowed for iOS. The export steps sign with the cloud-managed distribution certificate.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Schiesstagebuch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee "$RUNNER_TEMP/archive.log" | xcpretty
          # The export keeps the entitlements the archived app is signed with, and an unsigned app has
          # none: sign it ad hoc with the project's entitlements (iCloud, push) first.
          ENTITLEMENTS=Schiesstagebuch/Schiesstagebuch.entitlements
          if [ -f "$ENTITLEMENTS" ]; then
            codesign --force --sign - --entitlements "$ENTITLEMENTS" \
              "$RUNNER_TEMP/Schiesstagebuch.xcarchive/Products/Applications/Schiesstagebuch.app"
          fi
      - name: Show the archive errors
        # xcpretty drops signing and account errors; show what xcodebuild actually said.
        if: failure() && steps.secrets.outputs.ready == 'true'
        run: |
          grep -iE "error|warning: .*(sign|certificate|profile)|certificate|provisioning" "$RUNNER_TEMP/archive.log" | sort -u | tail -40 || true
          echo "--- last lines ---"
          tail -40 "$RUNNER_TEMP/archive.log"
      - name: Sign and check the entitlements
        # Sign locally first, so a build that lost its iCloud or push entitlements is never uploaded.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Schiesstagebuch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/*.app > "$RUNNER_TEMP/entitlements.plist"
          cat "$RUNNER_TEMP/entitlements.plist"
          python3 tools/testflight.py check-entitlements "$RUNNER_TEMP/entitlements.plist" Schiesstagebuch/Schiesstagebuch.entitlements
      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Schiesstagebuch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
            -exportPath "$RUNNER_TEMP/upload" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          echo "### Build $BUILD_NUMBER uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
