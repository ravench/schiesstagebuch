name: TestFlight
# Uploads a build to TestFlight after the Build workflow passes on main.
# Needs the repository secrets ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 (an App Store
# Connect API key with the Admin role); without them the upload is skipped. With the
# ANTHROPIC_API_KEY secret, the Claude API writes the build's release notes from the commits
# since the last build (tools/changelog.py): into the app, which shows them once, and into
# the build's «What to Test».
on:
  workflow_run:
    workflows: [Build]
    types: [completed]
    branches: [main]
  workflow_dispatch:
defaults:
  run:
    # pipefail: otherwise a failing xcodebuild piped into xcpretty still passes.
    shell: bash -eo pipefail {0}
jobs:
  retry:
    # GitHub sometimes gives up on a queued macOS job ("The job was not acquired by Runner of type
    # hosted even after multiple attempts", 2026-11-04). Build then fails without running anything
    # and nothing would upload: start its failed jobs again, at most twice. A green re-run
    # triggers this workflow again and uploads as usual.
    if: >-
      github.event_name == 'workflow_run' &&
      github.event.workflow_run.conclusion == 'failure' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.run_attempt < 3
    runs-on: ubuntu-latest
    permissions:
      actions: write
      checks: read
      contents: read
    steps:
      - name: Re-run Build if no runner picked it up
        env:
          GH_TOKEN: ${{ github.token }}
          RUN: ${{ github.event.workflow_run.id }}
          ATTEMPT: ${{ github.event.workflow_run.run_attempt }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          REPO="${{ github.repository }}"
          # A newer commit on main has its own Build, which uploads; re-running this one only holds a Mac.
          MAIN=$(gh api "repos/$REPO/commits/main" --jq .sha)
          if [ "$MAIN" != "$SHA" ]; then
            echo "::notice::Not re-running: main has moved on to $MAIN."
            exit 0
          fi
          FAILED=$(gh api "repos/$REPO/actions/runs/$RUN/attempts/$ATTEMPT/jobs" \
            --jq '.jobs[] | select(.conclusion == "failure" or .conclusion == "cancelled") | .id')
          for JOB in $FAILED; do
            if ! gh api "repos/$REPO/check-runs/$JOB/annotations" --jq '.[].message' | grep -q "not acquired by Runner"; then
              echo "::notice::Build failed on its own (job $JOB); not re-running."
              exit 0
            fi
          done
          [ -n "$FAILED" ] || exit 0
          echo "::notice::No runner picked up Build attempt $ATTEMPT; re-running its failed jobs."
          gh run rerun "$RUN" --failed --repo "$REPO"
  wait:
    # Only builds whose tests passed, and only pushes to main (not PRs from a branch named main).
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    # Several merges within a minute make one upload: a newer run cancels the older run's wait,
    # and the upload job only runs after its own run's wait finished.
    concurrency:
      group: testflight-wait
      cancel-in-progress: true
    outputs:
      latest: ${{ steps.latest.outputs.latest }}
    steps:
      - name: Wait for more merges
        if: github.event_name == 'workflow_run'
        run: sleep 60
      - name: Check this is still the newest commit on main
        # A newer commit's Build may finish first (Mac runners queue); its own run uploads then.
        id: latest
        env:
          GH_TOKEN: ${{ github.token }}
          SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          if [ "${{ github.event_name }}" = workflow_run ]; then
            MAIN=$(gh api "repos/${{ github.repository }}/commits/main" --jq .sha)
            if [ "$MAIN" != "$SHA" ]; then
              echo "::notice::Upload skipped: main has moved on to $MAIN, whose run uploads instead."
              exit 0
            fi
          fi
          echo "latest=true" >> "$GITHUB_OUTPUT"
  upload:
    needs: wait
    if: needs.wait.outputs.latest == 'true'
    # One upload at a time; never cancel one that has started.
    concurrency:
      group: testflight
      cancel-in-progress: false
    # GitHub's Mac, or the self-hosted one named in the MAC_RUNNER variable while the repo is
    # private (README, CI on your own Mac).
    runs-on: ${{ github.event.repository.private && vars.MAC_RUNNER || 'macos-26' }}
    permissions:
      # Tags the uploaded commit (testflight/<build>): the next build's notes start after it.
      contents: write
    outputs:
      notes: ${{ steps.notes.outputs.notes }}
      build: ${{ steps.prepare.outputs.build }}
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
    steps:
      - name: Check secrets
        id: secrets
        run: |
          if [ -n "$ASC_KEY_ID" ] && [ -n "$ASC_ISSUER_ID" ] && [ -n "$ASC_KEY_P8" ]; then
            echo "ready=true" >> "$GITHUB_OUTPUT"
          else
            echo "::notice::TestFlight upload skipped: set the ASC_KEY_ID, ASC_ISSUER_ID and ASC_KEY_P8 secrets."
          fi
      - uses: actions/checkout@v5
        if: steps.secrets.outputs.ready == 'true'
        with:
          # The commit the Build workflow tested, not whatever main is now.
          ref: ${{ github.event.workflow_run.head_sha || github.sha }}
          # Images (app icon) are in Git LFS.
          lfs: true
          # The whole history: the tag of the last build, and the commits since it, for the notes.
          fetch-depth: 0
      - name: Prepare
        id: prepare
        if: steps.secrets.outputs.ready == 'true'
        run: |
          python3 -m unittest discover -s tools -p 'test_testflight.py'
          python3 -m unittest discover -s tools -p 'test_changelog.py'
          command -v xcodegen >/dev/null || brew install xcodegen
          xcodegen generate
          # RUNNER_TEMP is emptied after the job, key included, and so are xcodebuild's temporary
          # files and distribution logs from here on.
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          echo "TMPDIR=$RUNNER_TEMP" >> "$GITHUB_ENV"
          python3 tools/testflight.py export-options "$RUNNER_TEMP/ExportOptions.plist"
          python3 tools/testflight.py export-options "$RUNNER_TEMP/ExportLocal.plist" export
          BUILD=$(python3 tools/testflight.py build-number "${{ github.run_number }}")
          echo "BUILD_NUMBER=$BUILD" >> "$GITHUB_ENV"
          echo "build=$BUILD" >> "$GITHUB_OUTPUT"
          echo "Build number $BUILD"
      - name: Release notes
        # The commits since the last build, summarised by the Claude API into Changelog.json in the
        # bundle (the app shows it the first time the build is opened) and, below, into «What to
        # Test». Without the key, or when the API fails, the build goes out without notes.
        id: notes
        if: steps.secrets.outputs.ready == 'true'
        env:
          ANTHROPIC_API_KEY: ${{ secrets.ANTHROPIC_API_KEY }}
        run: |
          if [ -z "$ANTHROPIC_API_KEY" ]; then
            echo "::notice::Release notes skipped: set the ANTHROPIC_API_KEY secret."
            exit 0
          fi
          if python3 -m venv "$RUNNER_TEMP/venv" && "$RUNNER_TEMP/venv/bin/pip" install -q anthropic \
             && "$RUNNER_TEMP/venv/bin/python" tools/changelog.py notes Schiesstagebuch/Resources/Changelog.json; then
            # Only with bullets: the same commit again writes {"notes": {}}, and what-to-test would poll for nothing.
            if python3 tools/changelog.py has-notes Schiesstagebuch/Resources/Changelog.json; then
              echo "notes=$(cat Schiesstagebuch/Resources/Changelog.json)" >> "$GITHUB_OUTPUT"
            fi
          else
            echo "::warning::Release notes skipped: tools/changelog.py failed."
          fi
      - name: Archive
        # Unsigned: automatic signing here made every fresh runner create a new Apple Development
        # certificate until the team hit Apple's limit (2026-11-03), and ad hoc signing is not
        # allowed for iOS. The export steps sign with the cloud-managed distribution certificate.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild archive \
            -project Schiesstagebuch.xcodeproj \
            -scheme Schiesstagebuch \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -archivePath "$RUNNER_TEMP/Schiesstagebuch.xcarchive" \
            CODE_SIGNING_ALLOWED=NO \
            CURRENT_PROJECT_VERSION="$BUILD_NUMBER" | tee "$RUNNER_TEMP/archive.log" | xcpretty
          # The export keeps the entitlements the archived app is signed with, and an unsigned app has
          # none: sign it ad hoc with the project's entitlements (iCloud, push) first.
          ENTITLEMENTS=Schiesstagebuch/Schiesstagebuch.entitlements
          if [ -f "$ENTITLEMENTS" ]; then
            codesign --force --sign - --entitlements "$ENTITLEMENTS" \
              "$RUNNER_TEMP/Schiesstagebuch.xcarchive/Products/Applications/Schiesstagebuch.app"
          fi
      - name: Show the archive errors
        # xcpretty drops signing and account errors; show what xcodebuild actually said.
        if: failure() && steps.secrets.outputs.ready == 'true'
        run: |
          grep -iE "error|warning: .*(sign|certificate|profile)|certificate|provisioning" "$RUNNER_TEMP/archive.log" | sort -u | tail -40 || true
          echo "--- last lines ---"
          tail -40 "$RUNNER_TEMP/archive.log"
      - name: Sign and check the entitlements
        # Sign locally first, so a build that lost its iCloud or push entitlements is never uploaded.
        if: steps.secrets.outputs.ready == 'true'
        run: |
          xcodebuild -exportArchive \
            -archivePath "$RUNNER_TEMP/Schiesstagebuch.xcarchive" \
            -exportOptionsPlist "$RUNNER_TEMP/ExportLocal.plist" \
            -exportPath "$RUNNER_TEMP/export" \
            -allowProvisioningUpdates \
            -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
            -authenticationKeyID "$ASC_KEY_ID" \
            -authenticationKeyIssuerID "$ASC_ISSUER_ID"
          mkdir -p "$RUNNER_TEMP/ipa" && unzip -q -o "$RUNNER_TEMP"/export/*.ipa -d "$RUNNER_TEMP/ipa"
          codesign -d --entitlements :- "$RUNNER_TEMP"/ipa/Payload/*.app > "$RUNNER_TEMP/entitlements.plist"
          cat "$RUNNER_TEMP/entitlements.plist"
          python3 tools/testflight.py check-entitlements "$RUNNER_TEMP/entitlements.plist" Schiesstagebuch/Schiesstagebuch.entitlements
      - name: Upload to TestFlight
        if: steps.secrets.outputs.ready == 'true'
        run: |
          # A re-run keeps the build number: when the first attempt uploaded and failed after (the tag push),
          # App Store Connect would reject the build again; then only the tag is missing.
          if python3 tools/changelog.py build-exists "$RUNNER_TEMP/AuthKey.p8" "$BUILD_NUMBER"; then
            echo "::notice::Build $BUILD_NUMBER is on App Store Connect already; not uploaded again."
          else
            xcodebuild -exportArchive \
              -archivePath "$RUNNER_TEMP/Schiesstagebuch.xcarchive" \
              -exportOptionsPlist "$RUNNER_TEMP/ExportOptions.plist" \
              -exportPath "$RUNNER_TEMP/upload" \
              -allowProvisioningUpdates \
              -authenticationKeyPath "$RUNNER_TEMP/AuthKey.p8" \
              -authenticationKeyID "$ASC_KEY_ID" \
              -authenticationKeyIssuerID "$ASC_ISSUER_ID"
            echo "### Build $BUILD_NUMBER uploaded to TestFlight" >> "$GITHUB_STEP_SUMMARY"
          fi
          git tag -f "testflight/$BUILD_NUMBER"
          git push origin "refs/tags/testflight/$BUILD_NUMBER"
  what-to-test:
    # Puts the release notes into the build's «What to Test» once App Store Connect has processed
    # it, which takes minutes to an hour: on Linux, so no Mac waits.
    needs: upload
    if: needs.upload.outputs.notes != ''
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      ASC_KEY_ID: ${{ secrets.ASC_KEY_ID }}
      ASC_ISSUER_ID: ${{ secrets.ASC_ISSUER_ID }}
      ASC_KEY_P8: ${{ secrets.ASC_KEY_P8 }}
      NOTES: ${{ needs.upload.outputs.notes }}
      BUILD_NUMBER: ${{ needs.upload.outputs.build }}
    steps:
      - uses: actions/checkout@v5
      - name: Set «What to Test»
        run: |
          echo "$ASC_KEY_P8" > "$RUNNER_TEMP/AuthKey.p8"
          python3 tools/changelog.py what-to-test "$RUNNER_TEMP/AuthKey.p8" "$BUILD_NUMBER" <<< "$NOTES"
