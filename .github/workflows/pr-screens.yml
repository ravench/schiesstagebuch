name: PR screens
# Screenshots of the screens a pull request changes, before and after, as a comment on the pull request.
# Takes the tour in SchiesstagebuchUITests/PRScreensTests.swift on an iPhone simulator, first on the pull
# request, then on its base branch, and shows the screens that look different. The images are kept on
# the pr-screens branch; all screens of a run are in its "pr-screens" artifact.
on:
  pull_request:
    paths:
      - Schiesstagebuch/**
      - SchiesstagebuchUITests/**
      - calibre-data
      - project.yml
      - tools/pr_screens.py
      - .github/workflows/pr-screens.yml
concurrency:
  group: pr-screens-${{ github.event.pull_request.number }}
  cancel-in-progress: true
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  screens:
    runs-on: macos-26
    permissions:
      # Pushes the images to the pr-screens branch and comments on the pull request.
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true
          # The merge commit and its first parent, the base branch.
          fetch-depth: 2
      - run: brew install xcodegen
      - name: Boot an iPhone with a fixed status bar
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tools/pr_screens.py pick-iphone)
          echo "UDID=$UDID" >> "$GITHUB_ENV"
          # Outside the checkout, which the base branch run replaces; upload-artifact rejects '..' paths.
          SCREENS="$RUNNER_TEMP/screens"
          echo "SCREENS=$SCREENS" >> "$GITHUB_ENV"
          xcrun simctl boot "$UDID"
          xcrun simctl bootstatus "$UDID"
          # Same clock and bars in both runs, so unchanged screens give the same image.
          xcrun simctl status_bar "$UDID" override --time 9:41 --dataNetwork wifi --wifiBars 3 \
            --cellularMode active --cellularBars 4 --batteryState charged --batteryLevel 100
          mkdir -p "$SCREENS"
          # The base branch is toured with this pull request's tour and tools.
          cp SchiesstagebuchUITests/PRScreensTests.swift tools/pr_screens.py tools/ipad_screens.py "$SCREENS/"
      - name: Screens of this pull request
        run: |
          xcodegen generate
          xcodebuild test -project Schiesstagebuch.xcodeproj -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" -only-testing:SchiesstagebuchUITests/PRScreensTests \
            -resultBundlePath "$SCREENS/after.xcresult" CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Screens of the base branch
        # A base without some of the screens still gives the others.
        if: always()
        continue-on-error: true
        run: |
          git checkout -q HEAD^1
          git submodule update -q
          cp "$SCREENS/PRScreensTests.swift" SchiesstagebuchUITests/
          xcodegen generate
          xcodebuild test -project Schiesstagebuch.xcodeproj -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" -only-testing:SchiesstagebuchUITests/PRScreensTests \
            -resultBundlePath "$SCREENS/before.xcresult" CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Compare
        id: compare
        if: always()
        run: |
          cd "$SCREENS"
          # Pillow lets the comparison ignore faint rendering noise.
          python3 -m venv venv && venv/bin/pip install -q pillow
          for side in after before; do
            mkdir -p "$side"
            [ -d "$side.xcresult" ] || continue
            # A run that broke off early leaves no readable result: that side just has no screens.
            xcrun xcresulttool export attachments --path "$side.xcresult" --output-path "raw-$side" || continue
            python3 pr_screens.py rename "raw-$side" "$side"
          done
          venv/bin/python pr_screens.py changes before after changed
          # Smaller copies for the comment; the artifact keeps the full size.
          find changed -name '*.png' -exec sips -Z 1200 {} \; >/dev/null
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: pr-screens
          path: |
            ${{ env.SCREENS }}/after
            ${{ env.SCREENS }}/before
      - name: Comment on the pull request
        # Pull requests from forks get a read-only token, so they only get the artifact.
        if: always() && steps.compare.outcome == 'success' && github.event.pull_request.head.repo.full_name == github.repository
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          cd "$SCREENS"
          # Each pull request has its own folder on the pr-screens branch; retry if another run pushed first.
          for attempt in 1 2 3 4 5 fail; do
            [ "$attempt" != fail ] || { echo "Could not push to pr-screens"; exit 1; }
            rm -rf branch && git init -q branch && cd branch
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git remote add origin "https://x-access-token:${GH_TOKEN}@github.com/${REPO}.git"
            if git fetch -q --depth 1 origin pr-screens; then git checkout -q -b pr-screens FETCH_HEAD; else git checkout -q --orphan pr-screens; fi
            rm -rf "$PR" && mkdir "$PR" && cp -R ../changed/before ../changed/after "$PR/"
            git add -A
            git commit -q --allow-empty -m "Screens for #$PR at ${{ github.event.pull_request.head.sha }}"
            git push -q origin pr-screens && break
            cd .. && sleep $((attempt * 3))
          done
          BASE_URL="https://raw.githubusercontent.com/${REPO}/$(git rev-parse HEAD)/${PR}"
          cd ..
          python3 pr_screens.py comment changed "$BASE_URL" "$RUN_URL" > comment.md
          # One comment per pull request, updated on every run.
          ID=$(gh api "repos/$REPO/issues/$PR/comments" --paginate \
            --jq '.[] | select(.body | startswith("<!-- pr-screens -->")) | .id' | head -1)
          if [ -n "$ID" ]; then
            gh api -X PATCH "repos/$REPO/issues/comments/$ID" -F body=@comment.md >/dev/null
          else
            gh api "repos/$REPO/issues/$PR/comments" -F body=@comment.md >/dev/null
          fi
