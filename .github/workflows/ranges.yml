name: Range catalogue
# Builds the shooting range catalogue from swisstopo swissTLM3D plus the hand-made indoor
# list (data/indoor-ranges.json) and uploads ranges.json / ranges.csv as a build artifact.
# Runs on demand, and on pull requests that change the builder or the list.
# Licence: swissTLM3D © swisstopo.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/range_catalogue.py
      - data/indoor-ranges.json
      - .github/workflows/ranges.yml
defaults:
  run:
    shell: bash -eo pipefail {0}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: python3 -m unittest discover -s tools -p 'test_range_catalogue.py'
      - name: Work directory
        # The swissTLM3D GeoPackage is several GB; /mnt has more room than the workspace.
        run: |
          sudo mkdir -p /mnt/ranges && sudo chown "$USER" /mnt/ranges
          echo "WORK=/mnt/ranges" >> "$GITHUB_ENV"
          df -h / /mnt
      - name: swissTLM3D
        run: |
          curl -fsS --retry 3 "https://data.geo.admin.ch/api/stac/v0.9/collections/ch.swisstopo.swisstlm3d/items" \
            -o "$WORK/stac.json"
          read -r RELEASE URL < <(python3 tools/range_catalogue.py latest-gpkg "$WORK/stac.json")
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Downloading swissTLM3D $RELEASE: $URL"
          curl -fL --retry 3 -sS "$URL" -o "$WORK/tlm.zip"
          ls -l "$WORK/tlm.zip"
          unzip -l "$WORK/tlm.zip"
          unzip -o -j "$WORK/tlm.zip" '*.gpkg' -d "$WORK"
          rm "$WORK/tlm.zip"
          GPKG=$(ls "$WORK"/*.gpkg | head -1)
          echo "GPKG=$GPKG" >> "$GITHUB_ENV"
          ls -l "$GPKG"
      - name: Inspect
        run: python3 tools/range_catalogue.py inspect "$GPKG" | tee "$WORK/inspect.txt"
      - name: Build
        run: |
          mkdir -p out
          python3 tools/range_catalogue.py build "$GPKG" data/indoor-ranges.json out "$RELEASE" | tee out/stats.txt
          cp "$WORK/inspect.txt" out/
          {
            echo "### Range catalogue (swissTLM3D $RELEASE)"
            echo '```'
            cat out/stats.txt
            echo '```'
            echo "#### First 25 ranges"
            echo '```'
            head -26 out/ranges.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: range-catalogue
          path: out/
      - name: Publish to the range-data branch
        # Keeps the latest output readable without downloading artifacts (and without
        # adding commits to the PR). Not for pull requests from forks.
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd out
          git init -q -b range-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranges.json ranges.csv stats.txt inspect.txt
          git commit -q -m "Range catalogue from swissTLM3D $RELEASE (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" range-data
