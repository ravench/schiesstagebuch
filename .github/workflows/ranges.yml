name: Range catalogue
# Builds the shooting range catalogue from swisstopo swissTLM3D plus the hand-made indoor
# list (data/indoor-ranges.json), adds street addresses from swisstopo's official building
# address directory, and uploads ranges.json / ranges.csv as a build artifact.
# Runs on demand, and on pull requests that change the builder or the list.
# Licence: swissTLM3D and amtliches Gebäudeadressverzeichnis © swisstopo (commercial use allowed).
on:
  workflow_dispatch:
  pull_request:
    paths:
      - tools/range_catalogue.py
      - data/indoor-ranges.json
      - .github/workflows/ranges.yml
# A newer push to the same pull request cancels this run. On main a running build
# finishes; a newer merge only replaces a run that is still waiting for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash -eo pipefail {0}
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Tests
        run: python3 -m unittest discover -s tools -p 'test_range_catalogue.py'
      - name: Work directory
        # The swissTLM3D GeoPackage is several GB; /mnt has more room than the workspace.
        run: |
          sudo mkdir -p /mnt/ranges && sudo chown "$USER" /mnt/ranges
          echo "WORK=/mnt/ranges" >> "$GITHUB_ENV"
          df -h / /mnt
      - name: swissTLM3D
        run: |
          curl -fsS --retry 3 "https://data.geo.admin.ch/api/stac/v0.9/collections/ch.swisstopo.swisstlm3d/items" \
            -o "$WORK/stac.json"
          read -r RELEASE URL < <(python3 tools/range_catalogue.py latest-gpkg "$WORK/stac.json")
          echo "RELEASE=$RELEASE" >> "$GITHUB_ENV"
          echo "Downloading swissTLM3D $RELEASE: $URL"
          curl -fL --retry 3 -sS "$URL" -o "$WORK/tlm.zip"
          ls -l "$WORK/tlm.zip"
          unzip -l "$WORK/tlm.zip"
          unzip -o -j "$WORK/tlm.zip" '*.gpkg' -d "$WORK"
          rm "$WORK/tlm.zip"
          GPKG=$(ls "$WORK"/*.gpkg | head -1)
          echo "GPKG=$GPKG" >> "$GITHUB_ENV"
          ls -l "$GPKG"
      - name: Building addresses
        # swisstopo's official building address directories (amtliches Gebäudeadressverzeichnis)
        # for Switzerland and Liechtenstein, which swissTLM3D also covers. Same columns in both.
        run: |
          BASE=https://data.geo.admin.ch/ch.swisstopo.amtliches-gebaeudeadressverzeichnis
          for COUNTRY in ch li; do
            curl -fL --retry 3 -sS "$BASE/amtliches-gebaeudeadressverzeichnis_$COUNTRY/amtliches-gebaeudeadressverzeichnis_${COUNTRY}_2056.csv.zip" \
              -o "$WORK/addresses.zip"
            unzip -l "$WORK/addresses.zip"
            unzip -o -j "$WORK/addresses.zip" '*.csv' -d "$WORK/addresses-$COUNTRY"
            rm "$WORK/addresses.zip"
          done
          CH=$(ls -S "$WORK"/addresses-ch/*.csv | head -1)
          LI=$(ls -S "$WORK"/addresses-li/*.csv | head -1)
          if [ "$(head -1 "$CH" | sed 's/^\xEF\xBB\xBF//')" != "$(head -1 "$LI" | sed 's/^\xEF\xBB\xBF//')" ]; then
            echo "::error::Swiss and Liechtenstein address files have different columns"; head -1 "$CH" "$LI"; exit 1
          fi
          ADDRESSES="$WORK/addresses.csv"
          { cat "$CH"; echo; tail -n +2 "$LI"; } > "$ADDRESSES"  # echo: in case CH lacks a final newline
          echo "ADDRESSES=$ADDRESSES" >> "$GITHUB_ENV"
          head -3 "$ADDRESSES"
          wc -l "$CH" "$LI" "$ADDRESSES"
      - name: Inspect
        run: python3 tools/range_catalogue.py inspect "$GPKG" | tee "$WORK/inspect.txt"
      - name: Build
        run: |
          mkdir -p out
          python3 tools/range_catalogue.py build "$GPKG" data/indoor-ranges.json out "$RELEASE" "$ADDRESSES" \
            | tee out/stats.txt
          cp "$WORK/inspect.txt" out/
          {
            echo "### Range catalogue (swissTLM3D $RELEASE)"
            echo '```'
            cat out/stats.txt
            echo '```'
            echo "#### First 25 ranges"
            echo '```'
            head -26 out/ranges.csv
            echo '```'
          } >> "$GITHUB_STEP_SUMMARY"
      - uses: actions/upload-artifact@v5
        with:
          name: range-catalogue
          path: out/
      - name: Publish to the range-data branch
        # Keeps the latest output readable without downloading artifacts (and without
        # adding commits to the PR). Not for pull requests from forks.
        if: github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository
        run: |
          cd out
          git init -q -b range-data
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add ranges.json ranges.csv stats.txt inspect.txt
          git commit -q -m "Range catalogue from swissTLM3D $RELEASE (${GITHUB_SHA::7})"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" range-data
