name: iPad screens
# Screenshots of every main screen on an iPad simulator, portrait and landscape, with sample data.
# See them on the ipad-screens branch, or download the run's "ipad-screens" artifact. Runs by hand (Actions › iPad screens ›
# Run workflow) and on pull requests that touch the screenshot run itself.
on:
  workflow_dispatch:
  pull_request:
    paths:
      - .github/workflows/ipad-screens.yml
      - SchiesstagebuchUITests/**
      - Schiesstagebuch/Services/ScreenshotData.swift
# A newer push to the same pull request cancels this run. On main a running build
# finishes; a newer merge only replaces a run that is still waiting for a runner.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}
defaults:
  run:
    shell: bash -eo pipefail {0}
jobs:
  screens:
    runs-on: macos-26
    permissions:
      # Pushes the screenshots to the ipad-screens branch.
      contents: write
    steps:
      - uses: actions/checkout@v5
      - run: brew install xcodegen
      - run: xcodegen generate
      - name: Take screenshots
        run: |
          UDID=$(xcrun simctl list devices available -j | python3 tools/ipad_screens.py pick-ipad)
          echo "Screenshots on $UDID"
          xcodebuild test \
            -project Schiesstagebuch.xcodeproj \
            -scheme SchiesstagebuchScreens \
            -destination "id=$UDID" \
            -only-testing:SchiesstagebuchUITests/IPadScreensTests \
            -resultBundlePath "$RUNNER_TEMP/Screens.xcresult" \
            CODE_SIGNING_ALLOWED=NO | xcpretty
      - name: Export screenshots
        if: always()
        run: |
          xcrun xcresulttool export attachments --path "$RUNNER_TEMP/Screens.xcresult" --output-path "$RUNNER_TEMP/raw"
          python3 tools/ipad_screens.py rename "$RUNNER_TEMP/raw" ipad-screens
          # Screenshots come in the device's portrait buffer; turn landscape ones upright.
          for f in ipad-screens/landscape-*.png; do [ -e "$f" ] && sips -r 270 "$f" >/dev/null; done
          ls ipad-screens
      - uses: actions/upload-artifact@v5
        if: always()
        with:
          name: ipad-screens
          path: ipad-screens
      - name: Publish to the ipad-screens branch
        # Browsable on GitHub without downloading the zip; only the latest set is kept.
        # Pull requests from forks get a read-only token, so they only get the artifact.
        if: always() && (github.event_name == 'workflow_dispatch' || github.event.pull_request.head.repo.full_name == github.repository)
        run: |
          [ -n "$(ls ipad-screens 2>/dev/null)" ] || exit 0
          cd ipad-screens
          git init -q -b ipad-screens
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add .
          git commit -q -m "iPad screens for ${{ github.event.pull_request.head.sha || github.sha }}"
          git push -q -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" ipad-screens
          echo "Screenshots: https://github.com/${{ github.repository }}/tree/ipad-screens" >> "$GITHUB_STEP_SUMMARY"
