name: Schiesstagebuch
options:
  bundleIdPrefix: net.forestraven
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  Schiesstagebuch:
    type: application
    platform: iOS
    sources: [Schiesstagebuch]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: net.forestraven.schiesstagebuch
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Schiesstagebuch
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fotos von Scheiben und Resultaten zu einem Eintrag hinzufügen."
        INFOPLIST_KEY_NSCameraUsageDescription: "Scheiben direkt fotografieren und zum Eintrag speichern."
