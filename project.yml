name: Schiesstagebuch
options:
  bundleIdPrefix: ch.giotta
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: de
targets:
  Schiesstagebuch:
    type: application
    platform: iOS
    sources: [Schiesstagebuch]
    info:
      path: Schiesstagebuch/Info.plist
      properties:
        UIBackgroundModes: [remote-notification]
        # Show the app's Documents folder in the Files app (backups, files to import).
        UIFileSharingEnabled: true
        LSSupportsOpeningDocumentsInPlace: true
        CFBundleDevelopmentRegion: de
        CFBundleLocalizations: [de, en, fr, it]
    entitlements:
      path: Schiesstagebuch/Schiesstagebuch.entitlements
      properties:
        com.apple.developer.icloud-container-identifiers:
          - iCloud.ch.giotta.schiesstagebuch
        com.apple.developer.icloud-services:
          - CloudKit
        aps-environment: development
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.giotta.schiesstagebuch
        # Signing team of the maintainer. Forks: replace with your own team ID (or remove it and pick a team in Xcode).
        DEVELOPMENT_TEAM: PD9YC6KM5T
        CODE_SIGN_STYLE: Automatic
        MARKETING_VERSION: "0.1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "5.10"
        TARGETED_DEVICE_FAMILY: "1,2"
        GENERATE_INFOPLIST_FILE: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_ALTERNATE_APPICON_NAMES: AppIconHardcover
        INFOPLIST_KEY_CFBundleDisplayName: Schiesstagebuch
        # No own encryption, only what iOS provides: skips the export compliance question per build.
        INFOPLIST_KEY_ITSAppUsesNonExemptEncryption: NO
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        # App Store Connect checks the plain key and wants all four (iPad multitasking);
        # the iPhone-only key keeps the iPhone in portrait.
        INFOPLIST_KEY_UISupportedInterfaceOrientations: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPad: "UIInterfaceOrientationPortrait UIInterfaceOrientationPortraitUpsideDown UIInterfaceOrientationLandscapeLeft UIInterfaceOrientationLandscapeRight"
        INFOPLIST_KEY_UISupportedInterfaceOrientations_iPhone: UIInterfaceOrientationPortrait
        INFOPLIST_KEY_NSPhotoLibraryUsageDescription: "Fotos von Scheiben und Resultaten zu einem Eintrag hinzufügen."
        INFOPLIST_KEY_NSCameraUsageDescription: "Standblätter direkt fotografieren und zum Eintrag speichern."
  SchiesstagebuchTests:
    type: bundle.unit-test
    platform: iOS
    sources: [SchiesstagebuchTests]
    dependencies:
      - target: Schiesstagebuch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.giotta.schiesstagebuch.tests
        DEVELOPMENT_TEAM: PD9YC6KM5T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
  # Screenshots of every main screen for the iPad layout check (.github/workflows/ipad-screens.yml).
  SchiesstagebuchUITests:
    type: bundle.ui-testing
    platform: iOS
    sources: [SchiesstagebuchUITests]
    dependencies:
      - target: Schiesstagebuch
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ch.giotta.schiesstagebuch.uitests
        DEVELOPMENT_TEAM: PD9YC6KM5T
        CODE_SIGN_STYLE: Automatic
        SWIFT_VERSION: "5.10"
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: Schiesstagebuch
schemes:
  Schiesstagebuch:
    build:
      targets:
        Schiesstagebuch: all
        SchiesstagebuchTests: [test]
    run:
      config: Debug
    test:
      config: Debug
      gatherCoverageData: true
      targets:
        - SchiesstagebuchTests
    archive:
      config: Release
  # Own scheme so the screenshot run stays out of the normal unit test run.
  SchiesstagebuchScreens:
    build:
      targets:
        Schiesstagebuch: all
        SchiesstagebuchUITests: [test]
    test:
      config: Debug
      targets:
        - SchiesstagebuchUITests
